          type: string
          title: page
          format: int64
        count:
          type: integer
          title: count
          format: int32
        startDate:
          type: string
          title: start_date
        endDate:
          type: string
          title: end_date
        properties:
          type: array
          items:
            type: string
          title: properties
        extras:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: extras
      title: SearchRequest
