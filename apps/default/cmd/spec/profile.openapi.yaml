      additionalProperties: false
    profile.v1.RemoveRosterRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        name:
          type: string
          title: name
          description: List name for scoped removal
      title: RemoveRosterRequest
      additionalProperties: false
    profile.v1.RemoveRosterResponse:
      type: object
      properties:
        roster:
          allOf:
            - $ref: '#/components/schemas/profile.v1.RosterObject'
          title: roster
