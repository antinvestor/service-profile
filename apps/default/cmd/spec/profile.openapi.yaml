          type: string
          title: id
        partitionId:
          type: string
          title: partition_id
      title: GetByIDAndPartitionRequest
      additionalProperties: false
    profile.v1.GetByIDAndPartitionResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileObject'
          title: data
      title: GetByIDAndPartitionResponse
      additionalProperties: false
    profile.v1.GetByIdRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
      title: GetByIdRequest
      additionalProperties: false
      description: The request message containing the profile's hash
    profile.v1.GetByIdResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileObject'
          title: data
      title: GetByIdResponse
      additionalProperties: false
    profile.v1.GetContactsRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: '[0-9a-z_-]{3,40}'
          title: ids
          maxItems: 100
          minItems: 1
          description: Contact ids to resolve. Pass one id or a batch (max 100).
      title: GetContactsRequest
      additionalProperties: false
      description: GetContactsRequest resolves contacts by id (one or many).
    profile.v1.GetContactsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.ContactObject'
          title: data
          description: Found contacts (standalone or profile-attached).
        missingIds:
          type: array
          items:
            type: string
          title: missing_ids
          description: Requested ids that were not found or not readable.
      title: GetContactsResponse
      additionalProperties: false
    profile.v1.ListRelationshipRequest:
      type: object
      properties:
        peerName:
          type: string
          title: peer_name
          maxLength: 40
          minLength: 3
          enum:
            - Contact
            - Profile
            - Group
        peerId:
          type: string
          title: peer_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        lastRelationshipId:
          type: string
          title: last_relationship_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        relatedChildrenId:
          type: array
          items:
            type: string
          title: related_children_id
          description: Related profile ids to specifically search for.
        count:
          type: integer
          title: count
          format: int32
        invertRelation:
          type: boolean
          title: invert_relation
      title: ListRelationshipRequest
      additionalProperties: false
      description: Request message to list all profiles related to the supplied profile id
    profile.v1.ListRelationshipResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.RelationshipObject'
          title: data
      title: ListRelationshipResponse
      additionalProperties: false
    profile.v1.MergeRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        mergeid:
          type: string
          title: mergeid
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
      title: MergeRequest
      additionalProperties: false
      description: The request message containing the profile's hash
    profile.v1.MergeResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileObject'
          title: data
      title: MergeResponse
      additionalProperties: false
    profile.v1.ProfileAccount:
      type: object
      properties:
        address:
          type: string
          title: address
          description: Account address, lowercase 0x-prefixed hex (20 bytes).
        family:
          type: string
          title: family
          description: Account family; "EVM" in protocol v1.
        version:
          type: integer
          title: version
          description: Protocol account version the address was derived for.
        identitySaltHash:
          type: string
          title: identity_salt_hash
          format: byte
          description: |-
            keccak256 of the profile's identity salt (32 bytes); the StawiAccount
             constructor argument.
        primary:
          type: boolean
          title: primary
          description: |-
            True for the account derived for this profile; false for accounts that
             arrived through a merge.
      title: ProfileAccount
      additionalProperties: false
      description: |-
        ProfileAccount is a chain account derived for a profile:
         address = CREATE2(factory, ACCOUNT_SALT(family, version, identity_salt_hash),
         keccak256(creation_code || identity_salt_hash)). The identity salt itself
         never leaves the profile service.
    profile.v1.ProfileObject:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Unique profile ID
        type:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileType'
          title: type
          description: Profile type (person, institution, bot)
        properties:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: properties
          description: Profile properties (name, bio, avatar, etc.)
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.ContactObject'
          title: contacts
          description: Associated contacts
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.AddressObject'
          title: addresses
          description: Associated addresses
        state:
          allOf:
            - $ref: '#/components/schemas/common.v1.STATE'
          title: state
          description: Profile state
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.ProfileAccount'
          title: accounts
          description: |-
            Chain accounts the profile owns, primary first. Only PERSON profiles
             own accounts; a merge adds the merged profile's accounts as secondary.
      title: ProfileObject
      additionalProperties: false
      description: ProfileObject represents a complete user or entity profile.
    profile.v1.ProfileType:
      type: string
      title: ProfileType
      enum:
        - PERSON
        - INSTITUTION
        - BOT
      description: |-
        ProfileType defines the type of profile entity.
         buf:lint:ignore ENUM_VALUE_PREFIX
    profile.v1.PropertyEntryObject:
      type: object
      properties:
        key:
          type: string
          title: key
        value:
          type: string
          title: value
        tenantId:
          type: string
          title: tenant_id
        createdBy:
          type: string
          title: created_by
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
        scoped:
          type: boolean
          title: scoped
      title: PropertyEntryObject
      additionalProperties: false
    profile.v1.PropertyHistoryRequest:
      type: object
      properties:
        id:
          type: string
          title: id
        key:
          type: string
          title: key
      title: PropertyHistoryRequest
      additionalProperties: false
    profile.v1.PropertyHistoryResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.PropertyEntryObject'
          title: entries
      title: PropertyHistoryResponse
      additionalProperties: false
    profile.v1.RawContact:
      type: object
      properties:
        contact:
          type: string
          title: contact
        extras:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: extras
      title: RawContact
      additionalProperties: false
    profile.v1.RelationshipObject:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Unique relationship ID
        type:
          allOf:
            - $ref: '#/components/schemas/profile.v1.RelationshipType'
          title: type
          description: Relationship type
        properties:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: properties
          description: Relationship properties
        childEntry:
          allOf:
            - $ref: '#/components/schemas/profile.v1.EntryItem'
          title: child_entry
          description: Child entry in relationship
        parentEntry:
          allOf:
            - $ref: '#/components/schemas/profile.v1.EntryItem'
          title: parent_entry
          description: Parent entry in relationship
        peerProfile:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileObject'
          title: peer_profile
          description: Peer profile information
      title: RelationshipObject
      additionalProperties: false
      description: RelationshipObject represents a relationship between two profiles.
    profile.v1.RelationshipType:
      type: string
      title: RelationshipType
      enum:
        - MEMBER
        - AFFILIATED
        - BLACK_LISTED
      description: |-
        RelationshipType defines how two profiles are linked.
         buf:lint:ignore ENUM_VALUE_PREFIX
    profile.v1.RemoveContactRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
      title: RemoveContactRequest
      additionalProperties: false
      description: The request message containing the information necessary to remove a contact
    profile.v1.RemoveContactResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileObject'
          title: data
