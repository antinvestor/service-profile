      additionalProperties: false
    profile.v1.UpdateRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        properties:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: properties
        state:
          allOf:
            - $ref: '#/components/schemas/common.v1.STATE'
          title: state
        scoped:
          type: boolean
          title: scoped
      title: UpdateRequest
      additionalProperties: false
      description: The request message containing the information necessary to create a profile
    profile.v1.UpdateResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ProfileObject'
          title: data
      title: UpdateResponse
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security: []
tags:
  - name: profile.v1.ProfileService
    description: |-
      ProfileService manages user and entity profiles.
       All RPCs require authentication via Bearer token.
