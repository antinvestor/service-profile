      additionalProperties: false
    profile.v1.ResolveAccountsRequest:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: string
            pattern: ^0[xX][0-9a-fA-F]{40}$
          title: addresses
          maxItems: 500
          minItems: 1
          description: 0x-prefixed hex addresses, any case (max 500).
      title: ResolveAccountsRequest
      additionalProperties: false
      description: ResolveAccountsRequest maps chain account addresses to profiles.
    profile.v1.ResolveAccountsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/profile.v1.AccountOwner'
          title: data
      title: ResolveAccountsResponse
      additionalProperties: false
      description: |-
        ResolveAccountsResponse lists the owners of the known addresses. Addresses
         no profile owns are omitted.
    profile.v1.RosterObject:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Unique roster entry ID
        profileId:
          type: string
          title: profile_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Profile ID of the contact
        contact:
          allOf:
            - $ref: '#/components/schemas/profile.v1.ContactObject'
          title: contact
