version: v2
managed:
  enabled: true
  # Resolve imported modules to the BSR-generated Go packages the apps use,
  # not the modules' own go_package (common's points at the legacy
  # github.com/antinvestor/common v1 module).
  override:
    - file_option: go_package
      module: buf.build/antinvestor/common
      value: buf.build/gen/go/antinvestor/common/protocolbuffers/go/common/v1;commonv1
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
      value: buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go/buf/validate;validate
    - file_option: go_package
      module: buf.build/gnostic/gnostic
      value: buf.build/gen/go/gnostic/gnostic/protocolbuffers/go/gnostic/openapi/v3;openapiv3

plugins:
  # Go protobuf generation
  - remote: buf.build/protocolbuffers/go
    out: ..
    opt:
      - paths=source_relative

  # Go ConnectRPC generation
  - remote: buf.build/connectrpc/go
    out: ..
    opt:
      - paths=source_relative

  # OpenAPI generation
  - remote: buf.build/community/sudorandom-connect-openapi
    out: ..
    opt:
      - features=connectrpc;gnostic;protovalidate
      - content-types=json
      - allow-get
      - debug
