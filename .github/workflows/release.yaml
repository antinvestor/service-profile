name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing image tag to ship (e.g. v1.53.5). Empty = build from ref.
        required: false
        default: ""
      skip_migrate:
        description: Skip migrate jobs (emergency image-only)
        type: boolean
        default: false

jobs:
  docker:
    if: github.event_name == 'push' || inputs.tag == ''
    permissions:
      contents: read
      packages: write
    uses: antinvestor/common/.github/workflows/docker-release.yml@main

  buf-push:
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/buf-push.yaml@main
    secrets:
      buf_token: ${{ secrets.BUF_TOKEN }}

  # --- identity project ---
  ship-identity-profile:
    needs: [docker]
    if: always() && (needs.docker.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/cloudrun-ship.yml@main
    with:
      image: ghcr.io/antinvestor/service-profile:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      service: identity-profile
      migrate_job: identity-profile-migrate
      project_id: stawi-identity
      region: europe-west9
      ship_service_account: cloudrun-ship@stawi-identity.iam.gserviceaccount.com
      workload_identity_provider: projects/721554040672/locations/global/workloadIdentityPools/github/providers/github-ship
      skip_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrate == true }}

  # --- platform project (devices / settings / geolocation) ---
  ship-platform-devices:
    needs: [docker]
    if: always() && (needs.docker.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/cloudrun-ship.yml@main
    with:
      image: ghcr.io/antinvestor/service-profile-devices:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      service: platform-devices
      migrate_job: platform-devices-migrate
      project_id: stawi-platform
      region: europe-west9
      ship_service_account: cloudrun-ship@stawi-platform.iam.gserviceaccount.com
      workload_identity_provider: projects/305282281906/locations/global/workloadIdentityPools/github/providers/github-ship
      skip_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrate == true }}

  ship-platform-settings:
    needs: [docker]
    if: always() && (needs.docker.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/cloudrun-ship.yml@main
    with:
      image: ghcr.io/antinvestor/service-profile-settings:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      service: platform-settings
      migrate_job: platform-settings-migrate
      project_id: stawi-platform
      region: europe-west9
      ship_service_account: cloudrun-ship@stawi-platform.iam.gserviceaccount.com
      workload_identity_provider: projects/305282281906/locations/global/workloadIdentityPools/github/providers/github-ship
      skip_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrate == true }}

  ship-platform-geolocation:
    needs: [docker]
    if: always() && (needs.docker.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    permissions:
      contents: read
      id-token: write
    uses: antinvestor/common/.github/workflows/cloudrun-ship.yml@main
    with:
      image: ghcr.io/antinvestor/service-profile-geolocation:${{ inputs.tag != '' && inputs.tag || github.ref_name }}
      service: platform-geolocation
      migrate_job: platform-geolocation-migrate
      project_id: stawi-platform
      region: europe-west9
      ship_service_account: cloudrun-ship@stawi-platform.iam.gserviceaccount.com
      workload_identity_provider: projects/305282281906/locations/global/workloadIdentityPools/github/providers/github-ship
      skip_migrate: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_migrate == true }}
